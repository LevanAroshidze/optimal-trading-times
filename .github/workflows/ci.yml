name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Ruff
        run: ruff check bot tests
      - name: Mypy
        run: mypy bot
        continue-on-error: true
      - name: Vulture
        run: vulture bot --min-confidence 80
        continue-on-error: true
      - name: Pytest
        run: pytest -q
