[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "optimal-trade-sessions-bot"
version = "0.1.0"
description = "Discord webhook announcer that classifies trading days from Forex Factory calendar rules."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27,<1.0",
  "PyYAML>=6.0,<7.0",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0"]

[project.scripts]
optimal-trade-sessions-bot = "bot.main:main"

[tool.setuptools]
packages = ["bot"]
